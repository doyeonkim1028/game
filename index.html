<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 투자성향 진단 게임</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* 클리닉 테마: 민트 · 흰색 · 연한 회색 + 포인트 빨간 스탬프 */
    --mint:#3DBFA8; --white:#FFFFFF; --gray:#F4F6F8; --stamp:#E5484D;
    --bg:var(--gray); --card:var(--white); --ink:#1c2428; --sub:#66737c; --line:#e2e7eb; --soft:var(--gray);
    --accent:#1f8a77;            /* 흰 배경 위 글자용 진한 민트 (대비 확보) */
    --accent-soft:#e4f6f2; --on-mint:#073a31;
    --t1:#2f74b5; --t2:#2fa892; --t3:#c98e0c; --t4:#e06a2c; --t5:#E5484D;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#101416; --card:#192023; --ink:#e7eef0; --sub:#94a2a9; --line:#2a3438; --soft:#1f272b;
      --accent:#5fd3bf; --accent-soft:#163a34;
    }
  }
  :root[data-theme="dark"]{
    --bg:#101416; --card:#192023; --ink:#e7eef0; --sub:#94a2a9; --line:#2a3438; --soft:#1f272b;
    --accent:#5fd3bf; --accent-soft:#163a34;
  }
  *{box-sizing:border-box}
  html{overflow-x:hidden}
  body{overflow-x:clip}   /* hidden 이면 body 가 스크롤 상자가 되어 position:sticky(처방전 요약·문진 단계)가 안 붙음 */
  body{margin:0;font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:28px 16px;transition:background .4s}
  .wrap{width:100%;max-width:640px;position:relative;z-index:1}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px 28px;box-shadow:0 8px 30px rgba(20,60,55,.07);transition:background .4s,border-color .4s}
  svg.i{width:1em;height:1em;flex:none;vertical-align:-.15em}
  .lead{color:var(--sub);line-height:1.7;margin:0 0 22px}
  .lead strong{color:var(--ink)}
  .tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:900;color:var(--accent);background:var(--accent-soft);padding:5px 12px;border-radius:999px}
  .btn{appearance:none;border:0;background:var(--mint);color:var(--on-mint);font:inherit;font-weight:900;font-size:16px;padding:14px 22px;border-radius:12px;cursor:pointer;width:100%;transition:transform .1s, filter .2s}
  .btn:hover{filter:brightness(1.05)}.btn:active{transform:scale(.98)}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--mint)}
  .row{display:flex;gap:10px;margin-top:12px}
  .fade{animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .leaving{animation:leave .35s ease forwards}
  @keyframes leave{to{opacity:0;transform:translateY(-8px) scale(.98)}}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--mint);width:0;transition:width .35s ease}

  /* ===================== 배경 소품 (알약·캡슐·청진기·약봉투) ===================== */
  .props{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .props span{position:absolute;color:var(--mint);opacity:.16;transition:opacity .5s;animation:float var(--d) ease-in-out var(--dl) infinite alternate}
  .props span.red{color:var(--stamp)}
  .props svg{width:100%;height:100%;display:block}
  body.s-start .props span{opacity:.34}
  body.s-start .props span.red{opacity:.26}
  @keyframes float{from{transform:translateY(-10px) rotate(var(--r))}to{transform:translateY(10px) rotate(calc(var(--r) + 14deg))}}

  /* ===================== 1. 접수 (시작화면) ===================== */
  .clinic{display:flex;align-items:center;gap:12px;padding-bottom:16px;margin-bottom:22px;border-bottom:1.5px dashed var(--line)}
  .clinic-logo{width:44px;height:44px;border-radius:14px;background:var(--mint);color:#fff;display:grid;place-items:center;font-size:24px;flex:none}
  .clinic b{display:block;font-size:16px;font-weight:900}
  .clinic small{display:block;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:var(--sub);margin-top:2px}
  .open{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:900;color:var(--accent);background:var(--accent-soft);padding:5px 10px;border-radius:999px;white-space:nowrap}
  .open i{width:7px;height:7px;border-radius:50%;background:var(--mint);animation:blink 1.4s ease-in-out infinite}
  @keyframes blink{50%{opacity:.25}}
  .s-title{font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1.25;margin:0 0 10px}
  .s-title b{color:var(--mint)}
  .sec-lbl{font-size:12px;font-weight:900;color:var(--sub);letter-spacing:.04em;margin-bottom:8px}
  .dept{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:0 0 22px}
  .dept div{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 4px 9px;text-align:center;min-width:0}
  .dept .e{font-size:20px;line-height:1}
  .dept .n{display:block;font-size:11px;font-weight:700;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dose{display:flex;justify-content:center;gap:2px;margin-top:6px}
  .dose i{width:5px;height:5px;border-radius:50%;background:var(--line)}
  .dose i.on{background:var(--c)}
  .dept-cap{font-size:11px;color:var(--sub);text-align:right;margin:-16px 0 20px}

  .ticket{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--accent-soft);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:var(--accent);font-weight:700}
  .ticket b{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:800;margin-left:6px}
  .f-lbl{display:block;font-size:13px;font-weight:700;margin-bottom:8px}
  .inp{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:0 14px;transition:border-color .2s, box-shadow .2s}
  .inp:focus-within{border-color:var(--mint);box-shadow:0 0 0 3px rgba(61,191,168,.18)}
  .inp>svg{width:22px;height:22px;color:var(--mint)}
  .inp input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--ink);font:inherit;font-size:16px;padding:14px 0}
  .inp input::placeholder{color:var(--sub);opacity:.7}
  .inp small{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sub)}
  .cta{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;font-size:17px;padding:16px 22px;box-shadow:0 8px 22px rgba(61,191,168,.35);animation:pulse 2s ease-in-out infinite}
  .cta svg{width:20px;height:20px}
  @keyframes pulse{50%{box-shadow:0 2px 8px rgba(61,191,168,.18)}}
  .hint{text-align:center;font-size:12px;color:var(--sub);margin-top:10px}
  .legal{text-align:center;font-size:11.5px;color:var(--sub);opacity:.85;margin:14px 0 0;line-height:1.6}

  /* ===================== 2. 문진표 (문항) ===================== */
  .q-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
  .q-head span:last-child{font-size:13px;color:var(--sub);text-align:right}
  .q-meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:22px 0 6px}
  .scene{font-size:13px;color:var(--accent);font-weight:900}
  .q-no{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--sub);font-weight:700}
  .q{font-size:20px;font-weight:700;line-height:1.5;margin:0 0 18px}
  .q em{font-style:normal;color:var(--mint);font-family:'JetBrains Mono',monospace;font-weight:800;margin-right:6px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:center;gap:12px;text-align:left;font:inherit;font-size:15px;color:var(--ink);background:var(--soft);border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;cursor:pointer;line-height:1.5;transition:border-color .15s, background .15s}
  .opt:hover{border-color:var(--mint);background:var(--accent-soft)}
  .ck{flex:none;width:20px;height:20px;border:2px solid var(--line);border-radius:6px;background:var(--card);display:grid;place-items:center;transition:background .15s,border-color .15s}
  .ck svg{width:14px;height:14px;color:#fff;opacity:0}
  .opt:hover .ck{border-color:var(--mint)}
  .opt.picked{border-color:var(--mint);background:var(--accent-soft);font-weight:700}
  .opt.picked .ck{background:var(--mint);border-color:var(--mint)}
  .opt.picked .ck svg{opacity:1}
  .back{background:none;border:0;color:var(--sub);font:inherit;font-size:13px;cursor:pointer;padding:0;margin-top:18px}
  .back:disabled{opacity:.3;cursor:default}

  /* ===================== 3. 진단 중... (로딩) ===================== */
  .diag{text-align:center;padding:18px 0 6px}
  .diag-icon{width:96px;height:96px;margin:0 auto 18px;border-radius:50%;background:var(--accent-soft);color:var(--mint);display:grid;place-items:center;font-size:48px;animation:beat 1s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}45%{transform:scale(1.05)}}
  .diag-title{font-size:26px;font-weight:900;margin:0 0 6px}
  .diag-title i{font-style:normal;animation:dot 1.2s infinite}
  .diag-title i:nth-child(2){animation-delay:.2s}.diag-title i:nth-child(3){animation-delay:.4s}
  @keyframes dot{0%,60%,100%{opacity:.2}30%{opacity:1}}
  .ecg{display:block;width:100%;max-width:340px;height:60px;margin:10px auto 6px}
  .ecg polyline{fill:none;stroke:var(--mint);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:420;stroke-dashoffset:420;animation:ecg 1.6s linear infinite}
  @keyframes ecg{to{stroke-dashoffset:0}}
  .diag-step{font-size:14px;color:var(--sub);font-weight:700;min-height:22px;margin:0 0 14px}
  .diag .bar{max-width:280px;margin:0 auto}
  .diag-pills{display:flex;justify-content:center;gap:14px;margin-top:20px;font-size:22px}
  .diag-pills span{animation:hop 1.2s ease-in-out infinite}
  .diag-pills span:nth-child(2){animation-delay:.15s}.diag-pills span:nth-child(3){animation-delay:.3s}.diag-pills span:nth-child(4){animation-delay:.45s}
  @keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}

  /* ===================== 4. 처방전 (결과) ===================== */
  body.s-result .card{border-top:6px solid var(--mint)}
  .rx-head{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:3px double var(--line)}
  .rx-sym{font-size:40px;font-weight:900;color:var(--mint);line-height:1;font-family:Georgia,serif}
  .rx-head h2{margin:0;font-size:24px;font-weight:900;letter-spacing:.4em}
  .rx-head small{display:block;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:var(--sub);margin-top:2px}
  .rx-head .bag{margin-left:auto;font-size:30px;color:var(--mint)}
  .rx-meta{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:0 0 4px;font-size:13px}
  .rx-meta div{display:flex;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line);min-width:0}
  .rx-meta dt{color:var(--sub);white-space:nowrap}
  .rx-meta dd{margin:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rx-meta dd.mono{font-family:'JetBrains Mono',monospace;font-size:12px}
  .dx{position:relative;margin:18px 0 0;padding:18px;background:var(--soft);border:1px solid var(--line);border-radius:14px}
  .dx .lbl{font-size:12px;font-weight:900;color:var(--sub)}
  .char{height:170px;margin:8px 0 8px;display:flex;align-items:flex-end}
  .char img{height:100%;width:auto;max-width:100%;object-fit:contain;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
  .char-emoji{display:grid;place-items:center;width:120px;height:120px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:60px;line-height:1}
  @keyframes pop{from{opacity:0;transform:scale(.7) translateY(10px)}to{opacity:1;transform:none}}
  .char-tag{display:inline-block;font-size:12.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:999px;margin:0 0 8px}
  .who{font-size:14px;color:var(--sub);font-weight:700}
  .rtype{font-size:32px;font-weight:900;margin:2px 0 6px;letter-spacing:-.5px}
  .dx .one{margin:0;color:var(--sub);line-height:1.6;font-size:14.5px}
  .stamp{position:absolute;right:14px;top:16px;width:94px;height:94px;border-radius:50%;border:3px solid var(--stamp);color:var(--stamp);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    box-shadow:inset 0 0 0 3px var(--soft), inset 0 0 0 5px var(--stamp);transform:rotate(-14deg);opacity:.92;animation:stamp .5s cubic-bezier(.2,1.4,.4,1) .35s both}
  .stamp b{font-size:16px;font-weight:900;letter-spacing:.06em;line-height:1.1}
  .stamp span{font-size:10.5px;font-weight:900;margin-top:3px;max-width:70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stamp small{font-family:'JetBrains Mono',monospace;font-size:8.5px;font-weight:700;margin-top:2px}
  @keyframes stamp{from{opacity:0;transform:rotate(-14deg) scale(2.2)}to{opacity:.92;transform:rotate(-14deg) scale(1)}}
  .gauge{margin:22px 0 8px}
  .gauge-track{position:relative;height:14px;border-radius:99px;background:linear-gradient(90deg,var(--t1),var(--t2),var(--t3),var(--t4),var(--t5))}
  .gauge-pin{position:absolute;top:-7px;width:4px;height:28px;background:var(--ink);border-radius:2px;transform:translateX(-50%);transition:left 1s cubic-bezier(.2,.8,.2,1)}
  .gauge-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:8px}
  h3{display:flex;align-items:center;gap:7px;font-size:15px;margin:24px 0 10px}
  h3 svg{width:18px;height:18px;color:var(--mint)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px}
  .stat b{display:block;font-size:26px;font-weight:900}
  .stat span{font-size:12px;color:var(--sub)}
  ul.desc{margin:0;padding-left:18px;line-height:1.8;font-size:14px}
  .fit{display:flex;gap:10px;align-items:flex-start;margin-top:10px;background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.6}
  .fit svg{width:20px;height:20px;color:var(--accent);margin-top:1px}
  .fit b{color:var(--accent)}
  /* 조제 내역 (추천 자산 비율 도넛) */
  .donut-wrap{position:relative;width:100%;max-width:240px;aspect-ratio:1;margin:4px auto 16px}
  .donut-wrap canvas{width:100%!important;height:100%!important}
  .donut-css{width:100%;height:100%;border-radius:50%;-webkit-mask:radial-gradient(circle,transparent 58%,#000 59%);mask:radial-gradient(circle,transparent 58%,#000 59%)}
  .donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
  .donut-center b{font-size:28px;line-height:1}
  .donut-center img.sm{width:72px;height:72px;object-fit:contain;display:block}
  .donut-center .char-emoji.sm{width:auto;height:auto;background:none;border:0;font-size:28px}
  .donut-center span{font-size:13px;font-weight:700;color:var(--sub);margin-top:4px}
  .assets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .assets li{display:grid;grid-template-columns:22px auto 1fr;align-items:center;column-gap:10px;row-gap:2px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:14px}
  .assets li>svg{width:22px;height:22px}
  .assets b{font-weight:900;white-space:nowrap}
  .assets em{font-style:normal;justify-self:end;font-weight:900;font-variant-numeric:tabular-nums}
  .assets small{grid-column:2 / 4;color:var(--sub);font-size:13px;line-height:1.5}
  .fine{font-size:11.5px;color:var(--sub);text-align:center;margin:10px 0 0}
  /* 임상 기록: 2020 시뮬레이션 */
  .sim-lead{font-size:14px;color:var(--sub);margin:-4px 0 12px;line-height:1.6}
  .sim-lead b{color:var(--ink)}
  .sim-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .sim-card{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
  .sim-card span{display:block;font-size:12px;color:var(--sub);font-weight:700}
  .sim-card b{display:block;font-size:20px;font-weight:900;margin-top:4px;font-variant-numeric:tabular-nums}
  .sim-card em{font-style:normal;font-weight:900;font-size:14px;font-variant-numeric:tabular-nums}
  .sim-card em.neg{color:#3d7bdc} .sim-card em.pos{color:var(--stamp)}
  .sim-say{grid-column:1 / -1}
  .sim-say p{margin:4px 0 0;font-size:15px;font-weight:700;line-height:1.5}
  .sim-chart{position:relative;height:300px}
  /* 오늘의 시장 바이탈 (야후 파이낸스 수집 데이터) */
  .vital{display:flex;flex-direction:column;gap:8px}
  .vital-row{display:grid;grid-template-columns:minmax(0,auto) minmax(60px,1fr) auto;align-items:center;column-gap:14px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .vital-row .nm b{display:block;font-size:14.5px;font-weight:900;white-space:nowrap}
  .vital-row .nm small{display:block;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sub);margin-top:2px;white-space:nowrap}
  .vital-row svg.spark{display:block;width:100%;height:32px}
  .vital-row .px{text-align:right}
  .vital-row .px b{display:block;font-size:17px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
  .vital-row .px em{font-style:normal;font-size:13px;font-weight:900;font-variant-numeric:tabular-nums}
  .vital-row .px small.usd{display:block;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sub)}
  .up{color:var(--stamp)} .down{color:#3d7bdc} .flat{color:var(--sub)}
  .vital-me{display:flex;gap:10px;align-items:flex-start;margin-top:10px;background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.6}
  .vital-me svg{width:20px;height:20px;color:var(--accent);margin-top:1px}
  .tm{margin-top:12px;padding:16px;background:var(--soft);border:1px solid var(--line);border-radius:14px}
  .tm-lbl{font-size:12.5px;font-weight:900;color:var(--sub)}
  .tm-big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
  .tm-big b{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
  .tm-big em{font-style:normal;font-size:17px;font-weight:900;font-variant-numeric:tabular-nums}
  .tm-sub{font-size:12.5px;color:var(--sub);line-height:1.6}
  .tm-bars{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .tm-bar{display:grid;grid-template-columns:76px 1fr 62px;align-items:center;gap:8px;font-size:12.5px;color:var(--sub)}
  .tm-bar.me{color:var(--ink);font-weight:900}
  .tm-track{position:relative;height:12px}
  .tm-track::before{content:'';position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--sub);opacity:.5}
  .tm-fill{position:absolute;top:0;bottom:0;border-radius:3px;opacity:.4}
  .tm-bar.me .tm-fill{opacity:1}
  .tm-fill.up{background:var(--stamp);left:50%}
  .tm-fill.down{background:#3d7bdc;right:50%}
  .tm-bar em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
  .basis{font-size:11.5px;color:var(--sub);line-height:1.6;margin:12px 0 0;padding-top:10px;border-top:1px dashed var(--line)}
  .basis b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
  .sim-cards + .basis{margin:-4px 0 12px;padding-top:0;border-top:0}
  .vital-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);margin-top:8px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
  td:last-child{text-align:right;font-weight:700;white-space:nowrap}
  details{margin-top:20px}
  summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--accent)}
  .rx-sign{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:22px;font-size:13px;color:var(--sub)}
  .rx-sign b{color:var(--ink)}
  .rx-sign i{font-style:normal;display:inline-grid;place-items:center;width:30px;height:30px;border:2px solid var(--stamp);border-radius:6px;color:var(--stamp);font-size:12px;font-weight:900;transform:rotate(-8deg)}
  .note{font-size:12px;color:var(--sub);line-height:1.6;margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}
  .copied{font-size:13px;color:var(--accent);text-align:center;margin-top:8px;min-height:18px}

  /* ===================== 반응형 배치 (휴대폰 ≤600 · 태블릿 601~999 · 컴퓨터 ≥1000) ===================== */
  /* 문진표: 단계 체크리스트 (컴퓨터에서만 보임) */
  .q-steps{display:none}
  .q-steps ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .q-steps li{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;font-size:14px;color:var(--sub);border:1.5px solid transparent}
  .q-steps li .st{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:900;font-family:'JetBrains Mono',monospace;background:var(--card)}
  .q-steps li .st svg{width:14px;height:14px}
  .q-steps li small{display:block;font-size:11.5px;color:var(--sub);font-weight:400;margin-top:1px}
  .q-steps li.done{color:var(--ink)}
  .q-steps li.done .st{background:var(--mint);border-color:var(--mint);color:#fff}
  .q-steps li.now{color:var(--ink);font-weight:900;background:var(--accent-soft);border-color:var(--mint)}
  .q-steps li.now .st{border-color:var(--mint);color:var(--accent)}
  .key{display:none}
  .key-hint{display:none}

  /* 처방전: 탭 */
  .tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:22px 0 4px;padding:4px;background:var(--soft);border:1px solid var(--line);border-radius:14px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:1 0 auto;appearance:none;border:0;background:transparent;font:inherit;font-size:14px;font-weight:700;color:var(--sub);padding:10px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}
  .tab[aria-selected="true"]{background:var(--card);color:var(--accent);box-shadow:0 1px 4px rgba(20,60,55,.12)}
  .tab:focus-visible{outline:2px solid var(--mint);outline-offset:1px}
  .tab-panel>h3:first-child{margin-top:16px}
  .rx-metrics.desk{display:none}
  .rx-actions.side{display:none}
  .rx-actions .row{margin-top:0}
  .rx-actions.bottom{margin-top:22px}

  @media (min-width:601px) and (max-width:999px){
    .wrap{max-width:760px}
  }
  @media (min-width:1000px){
    .wrap{max-width:1120px}
    .card{padding:36px 40px}
    /* 접수: 왼쪽 소개 · 오른쪽 접수 폼, 한 화면 */
    body.s-start{align-items:center;padding-top:20px;padding-bottom:20px}
    .s-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:48px;align-items:center}
    .s-left .dept{margin-bottom:22px}
    .s-left .dept-cap{margin:-14px 0 0}
    .s-right{background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:26px 24px}
    .s-right .legal{margin-top:16px}
    /* 문진표: 왼쪽 단계 · 오른쪽 질문 */
    .q-grid{display:grid;grid-template-columns:240px 1fr;gap:40px;align-items:start}
    .q-steps{display:block;position:sticky;top:20px;padding-right:28px;border-right:1.5px dashed var(--line)}
    .q-steps .tag{margin-bottom:14px}
    .q-main .q-head .tag{display:none}
    .key{display:inline-grid;place-items:center;flex:none;margin-left:auto;min-width:22px;height:22px;padding:0 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--sub);background:var(--card)}
    .key-hint{display:block;font-size:12px;color:var(--sub);margin-top:14px}
    /* 처방전: 왼쪽 요약(고정) · 오른쪽 탭 */
    .rx{display:grid;grid-template-columns:360px minmax(0,1fr);gap:36px;align-items:start}
    .rx-sum{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow-y:auto;scrollbar-width:thin;padding-right:4px}
    .rx-sum .rx-meta{grid-template-columns:1fr 1fr;column-gap:12px}
    .rx-sum .rx-meta div{flex-direction:column;gap:1px;padding:7px 2px}
    .rx-sum .rx-meta dt{font-size:11.5px}
    .rx-sum .dx{padding:14px 16px;margin-top:14px}
    .rx-sum .char{height:120px;margin:4px 0 6px}
    .rx-sum .gauge{margin:18px 0 6px}
    .rx-sum h3{margin:16px 0 8px}
    .rx-sum .stat{padding:10px 12px}
    .rx-sum .stat b{font-size:22px}
    .rx-metrics.desk{display:block}
    .rx-metrics.mob{display:none}
    .rx-actions.side{display:block;margin-top:20px}
    .rx-actions.bottom{display:none}
    .tabs{margin-top:0}
  }
  @media (max-width:600px){
    /* 휴대폰: 처방전 복사 · 다시 접수하기를 화면 맨 아래에 고정 */
    body.s-result{padding-bottom:104px}
    .rx-actions.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(20,60,55,.08)}
    .rx-actions.bottom .copied{margin-top:6px;min-height:0}
    .rx-actions.bottom .copied:empty{display:none}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px}   /* 4개 탭이 한 줄에 안 들어가서 2×2 */
    .tab{font-size:13.5px;padding:9px 8px}
  }

  @media (max-width:600px){
    .card{padding:26px 18px}
    .s-title{font-size:27px}
    .dept .n{font-size:10px}
    .dept .e{font-size:17px}
    .inp small{display:none}
    .rx-meta{grid-template-columns:1fr}

    .stamp{width:80px;height:80px;right:10px}
    .stamp b{font-size:12.5px;letter-spacing:0}
    .stamp span{font-size:9.5px;max-width:58px}
    .stamp small{font-size:7.5px}
    .rtype{font-size:28px}
    .char{height:140px}
    .sim-chart{height:280px} .sim-card b{font-size:17px}
    .vital-row{column-gap:10px;padding:11px 12px}
    .vital-row .px b{font-size:15.5px}
  }
  @media (prefers-reduced-motion: reduce){
    .props span,.open i,.cta,.diag-icon,.diag-title i,.ecg polyline,.diag-pills span,.stamp,.fade,.leaving,.char img{animation:none}
    .ecg polyline{stroke-dashoffset:0}
  }
</style>
</head>

/* 2020 코로나 폭락장 시뮬레이션: 실제 상품의 2019년 12월 말 ~ 2020년 12월 말 월말 값
   (야후 파이낸스, 배당 포함 수정주가. SPY 는 그날 원/달러 환율을 곱한 원화 값) */
const SIM = {
  base: 1000,                                  // 만 원
  kodex200: [25971.84,25216.18,23752.92,21040.42,22932.11,23780.29,24930.45,26630.94,27356.1,27658.63,26860.63,30911.11,35202.22],
  spyKrw:   [338411.5,347276.2,326300.0,286815.8,322253.6,344571.3,339467.6,356810.8,380906.5,359459.5,340178.8,368770.7,376230.8],
  bond3y:   [57000,57210,57545,57545,57730,58045,58050,58225,57980,58210,58105,58030,58055],
  depRate:  depositRate('2020-01-02'),         // 2020년 1월 가입 정기예금 금리 (연 %)
  labels: ['시작','1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'],
};
const TYPE_HEX = ['#2f74b5','#2fa892','#c98e0c','#e06a2c','#E5484D'];

  "안정형":"폭락장이요? 저는 뉴스로만 봤어요 ☕",

  "위험중립형":"3월엔 철렁했지만 차근차근 회복했어요 ⚖️",

  "공격투자형":"3월엔 울었지만 12월엔 웃었어요 😭➡️😆",
};
function simulate(mix){
  const [d,b,s,f] = mix.map(x=>x/100);
  const out = [SIM.base];
  for(let m=1;m<=12;m++){
    const df = 1 + SIM.depRate / 100 * m / 12;          // 예금: 고정금리, 경과 개월만큼 이자
    const bf = SIM.bond3y[m] / SIM.bond3y[0];
    const sf = SIM.kodex200[m] / SIM.kodex200[0];
    const ff = SIM.spyKrw[m] / SIM.spyKrw[0];
    out.push(SIM.base * (d*df + b*bf + s*sf + f*ff));
  }
  return out;   // [시작, 1월말 … 12월말] (만 원)
}

function score(){
  const sum = answers.reduce((s,a,i)=> s + QUESTIONS[i].opts[a][1], 0);
  const max = QUESTIONS.reduce((s,Q)=> s + Q.opts.length, 0);              // 만점 (5지선다 5점, 4지선다 4점)
  const ratio = answers.reduce((s,a,i)=> s + (QUESTIONS[i].opts[a][1]-1) / (QUESTIONS[i].opts.length-1), 0) / QUESTIONS.length;
  const tol = Math.round(ratio * 100);                                      // 0~100 위험감수도
  return { sum, max, tol, aversion: 100 - tol, type: TYPES.find(t => tol <= t.max) };
}

function renderQuestion(){
  setScreen('question');
  const Q = QUESTIONS[step];

  const stages = [];
  QUESTIONS.forEach((q, i) => { const s = stages.at(-1); if(s && s.name === q.scene) s.last = i; else stages.push({ name:q.scene, first:i, last:i }); });
  const stepList = stages.map((s, k) => {
    const state = step > s.last ? 'done' : step >= s.first ? 'now' : 'todo';
    return `<li class="${state}"${state === 'now' ? ' aria-current="step"' : ''}><span class="st">${state === 'done' ? ICON.check() : k + 1}</span><span>${s.name}<small>${s.last - s.first + 1}문항</small></span></li>`;
  }).join('');
  app.innerHTML = `
  <div class="fade q-grid">
   <aside class="q-steps" aria-label="문진 단계"><span class="tag">${ICON.pill()} 문진표</span><ol>${stepList}</ol></aside>

    <p class="q"><em>Q${step+1}.</em>${Q.q}</p>

      ${Q.opts.map((o,i)=>`<button class="opt ${answers[step]===i?'picked':''}" data-i="${i}"><span class="ck">${ICON.check()}</span><span>${o[0]}</span><kbd class="key" aria-hidden="true">${i+1}</kbd></button>`).join('')}
    </div>
    <span class="key-hint">키보드 숫자 1~${Q.opts.length}로도 고를 수 있어요</span>
    <button class="back" id="back" ${step===0?'disabled':''}>← 이전 문항</button>
   </div>
  </div>`;
  requestAnimationFrame(()=>{ const pg = document.getElementById('pg'); if(pg) pg.style.width = (step/QUESTIONS.length*100)+'%'; });
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    app.querySelectorAll('.opt').forEach(o => { o.classList.remove('picked'); o.disabled = true; });

}

      <ul class="desc">${type.desc.map(d=>`<li>${d}</li>`).join('')}</ul>
      <div class="fit">${ICON.capsule()}<span><b>처방 상품</b> · ${type.fit}</span></div>
    </section>

    <section class="tab-panel" role="tabpanel" id="panel-1" aria-labelledby="tab-1" hidden>
      <h3>${ICON.bag()} 조제 내역 · 추천 자산 비율</h3>
      <div class="donut-wrap" id="donutWrap" role="img" aria-label="${type.name} 추천 자산 비율: ${ASSETS.map((a,i)=>`${a.name} ${type.mix[i]}%`).join(', ')}">
        <canvas id="donut"></canvas>
        <div class="donut-center"><b>${charPic(type, 'sm')}</b><span>${type.name}</span></div>
      </div>
      <ul class="assets">
        ${ASSETS.map((a,i)=>`<li>${ICON.capsule(a.color)}<b>${a.name}</b><em>${type.mix[i]}%</em><small>${a.desc}</small></li>`).join('')}
      </ul>
      <p class="fine">재미로 보는 예시 비율이며 실제 투자 권유가 아닙니다.</p>
    </section>

    ${market ? `<section class="tab-panel" role="tabpanel" id="panel-2" aria-labelledby="tab-2" hidden>${market}</section>` : ''}

    <section class="tab-panel" role="tabpanel" id="panel-3" aria-labelledby="tab-3" hidden>
      ${simSection(type)}
    </section>

    <details>
      <summary>문진 기록 보기 (답변별 점수)</summary>
      <table style="margin-top:10px">
        ${QUESTIONS.map((Q,i)=>`<tr><td>${i+1}. ${Q.opts[answers[i]][0]}</td><td>${Q.opts[answers[i]][1]} / ${Q.opts.length}점</td></tr>`).join('')}
      </table>
    </details>

    <div class="rx-sign">위와 같이 처방합니다. <b>투자성향 클리닉</b><i aria-hidden="true">인</i></div>

    <p class="note">※ 점수 구간: 위험감수도 0~20 안정형 · 21~40 안정추구형 · 41~60 위험중립형 · 61~80 적극투자형 · 81~100 공격투자형.
    분류 체계는 금융투자협회 표준 투자자정보확인서의 5단계를 참고했으며, 문항과 배점은 게임용으로 단순화한 것입니다. 실제 투자 권유나 금융기관의 공식 투자성향 진단을 대신하지 않아요.</p>
   </div>
  </div>
  ${actions('bottom')}`;   /* .fade(transform 애니메이션) 밖에 둬야 하단 고정이 흔들리지 않음 */

  // 탭: 숨겨진 탭의 그래프는 그 탭을 처음 열 때 그림 (숨긴 상태로 그리면 크기가 0이 되어 깨짐)
  const drawn = {};
  const openTab = i => {
    app.querySelectorAll('.tab').forEach(b => { const on = +b.dataset.tab === i; b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1; });
    app.querySelectorAll('.tab-panel').forEach(p => { p.hidden = p.id !== `panel-${i}`; });
    if(i === 1 && !drawn[1]){ drawn[1] = true; drawDonut(type); }
    if(i === 3 && !drawn[3]){ drawn[3] = true; drawSim(type); }
  };
  const tabBtns = [...app.querySelectorAll('.tab')];
  tabBtns.forEach((b, k) => {
    b.onclick = () => openTab(+b.dataset.tab);
    b.onkeydown = e => {                            // 탭 목록에서 ←/→ 로 이동
      const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
      if(!d) return;
      e.preventDefault();
      const nb = tabBtns[(k + d + tabBtns.length) % tabBtns.length];
      nb.focus(); openTab(+nb.dataset.tab);
    };
  });

  later(()=>{ app.querySelectorAll('.gauge-pin').forEach(pin => pin.style.left = Math.min(98,Math.max(2,tol))+'%'); }, 80);
  const say = t => app.querySelectorAll('.copied').forEach(m => m.textContent = t);
  app.querySelectorAll('[data-act="again"]').forEach(b => b.onclick = () => { step = -1; render(); });
  app.querySelectorAll('[data-act="copy"]').forEach(b => b.onclick = async () => {
    const text = `[${nickname || DEFAULT_NICK}님의 처방전] ${type.emoji} ${type.name}${type.char ? ` (${type.char})` : ''}\n위험회피도 ${aversion}/100 · 위험감수도 ${tol}/100\n${type.one}\n처방 상품: ${type.fit}`;
    try { await navigator.clipboard.writeText(text); say('복사했어요!'); }
    catch(e){ say('복사가 막혀 있어요. 화면을 캡처해 공유해 주세요.'); }
  });
}

/* ===================== 오늘의 시장 바이탈 =====================
   collect_market.py 가 야후 파이낸스에서 모은 코스피·S&P 500 일봉을 #market-data 에 넣어 줌.
   데이터가 없으면 이 카드는 아예 그리지 않음. */
const MARKET = (() => {
  try { return JSON.parse(document.getElementById('market-data').textContent); } catch(e) { return null; }
})();
const MARKET_TARGET = 10;
const MARKET_KEYS = [['069500.KS', 2], ['SPY', 3], ['114260.KS', 1]];   // [티커, ASSETS/mix 인덱스]

function sparkSvg(days){
  if(days.length < 2) return '<svg class="spark" aria-hidden="true"></svg>';
  const cs = days.map(d => d.close), lo = Math.min(...cs), hi = Math.max(...cs), span = (hi - lo) || 1;
  const pts = cs.map((c,i) => `${(i/(cs.length-1)*100).toFixed(1)},${(29 - (c-lo)/span*26).toFixed(1)}`).join(' ');
  const cls = cs.at(-1) >= cs[0] ? 'up' : 'down';
  return `<svg class="spark ${cls}" viewBox="0 0 100 32" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
const chgCls = v => v == null ? 'flat' : v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
const chgTxt = v => v == null ? '—' : `${v > 0 ? '▲' : v < 0 ? '▼' : ''}${Math.abs(v).toFixed(2)}%`;
const shortDate = s => `${Number(s.slice(5,7))}/${Number(s.slice(8,10))}`;

function marketSection(type){
  const series = MARKET && MARKET.series;
  if(!series) return '';
  const rows = MARKET_KEYS.map(([k, ai]) => ({ k, ai, s: series[k] })).filter(r => r.s && r.s.days && r.s.days.length);
  if(!rows.length) return '';
  const collected = Math.max(...rows.map(r => r.s.days.length));

  // 내 처방 비율이면 최근 거래일 상품 가격 변동이 전체 자산에 준 영향 (각 상품 등락률 × 비중, 예금은 변동 없음)
  let impact = 0, used = 0;
  rows.forEach(r => { const c = r.s.days.at(-1).change_pct; if(c != null){ impact += c * type.mix[r.ai] / 100; used++; } });
  const stockPct = type.mix[2] + type.mix[3];
  const dep = depositRate(rows[0].s.days.at(-1).date);
  const depMonth = Number(DEPOSIT_RATES.at(-1)[0].slice(5, 7));      // 가장 최근 공표된 달
  const won0 = v => `${Math.round(v).toLocaleString('ko-KR')}원`;

  return `
    <h3>${ICON.steth()} 오늘의 시장 바이탈 · 실제 상품</h3>
    <div class="vital">
      ${rows.map(r => { const d = r.s.days.at(-1); return `
      <div class="vital-row">
        <div class="nm"><b>${esc(r.s.name)}</b><small>${esc(r.s.role || '')} · ${shortDate(d.date)} 종가</small></div>
        ${sparkSvg(r.s.days)}
        <div class="px"><b>${won0(d.close)}</b><em class="${chgCls(d.change_pct)}">${chgTxt(d.change_pct)}</em>${d.usd ? `<small class="usd">$${d.usd.toFixed(2)}</small>` : ''}</div>
      </div>`; }).join('')}
      <div class="vital-row">
        <div class="nm"><b>정기예금</b><small>예금 · 한국은행 ${depMonth}월 평균</small></div>
        <svg class="spark" aria-hidden="true"></svg>
        <div class="px"><b>연 ${dep.toFixed(2)}%</b><em class="flat">원금 보장</em></div>
      </div>
    </div>
    ${!stockPct ? `<div class="vital-me">${ICON.pill()}<span>${type.name} 처방에는 주식이 없어서, 오늘 주가가 어떻게 움직여도 자산은 거의 그대로예요.</span></div>`
      : used ? `<div class="vital-me">${ICON.pill()}<span>${type.name} 처방(주식 ${stockPct}%)이라면 최근 거래일 가격 변동 때문에 전체 자산이 약 <b class="${chgCls(impact)}">${impact >= 0 ? '+' : '−'}${Math.abs(impact).toFixed(2)}%</b> 움직였어요.</span></div>` : ''}
    ${threeMonth(type)}
    <div class="vital-meta"><span>출처 Yahoo Finance · ${esc(MARKET.updated || '')} 수집</span><span>${collected >= MARKET_TARGET ? `최근 ${MARKET_TARGET}거래일` : `수집 ${collected}/${MARKET_TARGET}거래일`}</span></div>
    <p class="fine">실제 상품 가격(수집 시점 기준, 실시간 아님). 수익률은 배당 포함, SPY는 원/달러 환율을 반영한 원화 기준. 예금은 한국은행 예금은행 저축성수신금리(신규취급액)를 가입 달 기준으로 적용, 중도해지 불이익은 무시. 수수료·세금 미반영. 투자 권유가 아닙니다.</p>`;
}

/* 지난 3개월 동안 처방 비율로 투자했다면? (실제 상품: KODEX 200, SPY 원화 환산, KODEX 국고채3년 + 가입 달 정기예금 금리) */
function threeMonth(type){
  const tm = key => MARKET.series[key] && MARKET.series[key].three_month;
  const k = tm('069500.KS'), s = tm('SPY'), b = tm('114260.KS');
  if(!k || !s || !b) return '';
  const days = (Date.parse(k.end_date) - Date.parse(k.start_date)) / 864e5;
  const depRet = depositRate(k.start_date) * days / 365;            // 예금: 가입 달 금리 × 경과 일수
  const ret = mix => (mix[0] * depRet + mix[1] * b.return_pct + mix[2] * k.return_pct + mix[3] * s.return_pct) / 100;
  const rets = TYPES.map(t => ret(t.mix));
  const mine = rets[TYPES.indexOf(type)];
  const maxAbs = Math.max(...rets.map(Math.abs), 0.01);
  const part = (label, v) => `${label} <span class="${chgCls(v)}">${pct(v)}</span>`;
  return `
    <div class="tm">
      <span class="tm-lbl">3개월 전에 ${type.name} 비율로 1,000만 원을 투자했다면?</span>
      <div class="tm-big"><b>${won(SIM.base * (1 + mine / 100))}</b><em class="${chgCls(mine)}">${pct(mine)}</em></div>
      <div class="tm-sub">${shortDate(k.start_date)} → ${shortDate(k.end_date)} · ${part('KODEX 200', k.return_pct)} · ${part('SPY', s.return_pct)}</div>
      <div class="tm-bars" role="img" aria-label="지난 3개월 유형별 수익률: ${TYPES.map((t,i)=>`${t.name} ${pct(rets[i])}`).join(', ')}">
        ${TYPES.map((t,i) => `<div class="tm-bar${t === type ? ' me' : ''}"><span>${t === type ? '★ ' : ''}${t.name}</span><div class="tm-track"><div class="tm-fill ${rets[i] >= 0 ? 'up' : 'down'}" style="width:${(Math.abs(rets[i]) / maxAbs * 50).toFixed(1)}%"></div></div><em class="${chgCls(rets[i])}">${pct(rets[i])}</em></div>`).join('')}
      </div>
      <p class="basis">예금 연 ${depositRate(k.start_date).toFixed(2)}%(${monthLabel(k.start_date)} 한국은행 평균) × ${Math.round(days)}일 = <b>${pct(depRet)}</b> · 채권 KODEX 국고채3년 같은 기간 <b>${pct(b.return_pct)}</b>(배당 포함)</p>
    </div>`;
}

function simSection(type){
  const v = simulate(type.mix);
  const months = v.slice(1);
  const lo = Math.min(...months), loM = months.indexOf(lo);
  const end = months[11];
  const loR = (lo/SIM.base-1)*100, endR = (end/SIM.base-1)*100;
  return `
    <h3>${ICON.capsule()} 임상 기록 · 2020년 코로나 폭락장에 투자했다면?</h3>
    <p class="sim-lead">2020년 1월 초에 <b>1,000만 원</b>을 ${type.name} 비율로 나눠 투자했다면…</p>
    <div class="sim-cards">
      <div class="sim-card"><span>최저점 · ${SIM.labels[loM+1]}</span><b>${won(lo)}</b><em class="${loR>=0?'pos':'neg'}">${pct(loR)}</em></div>
      <div class="sim-card"><span>최종 · 12월 말</span><b>${won(end)}</b><em class="${endR>=0?'pos':'neg'}">${pct(endR)}</em></div>
      <div class="sim-card sim-say"><span>한 줄 코멘트</span><p>${SIM_COMMENT[type.name]}</p></div>
    </div>
    <p class="basis">예금 연 ${SIM.depRate.toFixed(2)}%(2020년 1월 한국은행 평균) → 1년 <b>${pct(SIM.depRate)}</b> · 채권 KODEX 국고채3년 2020년 <b>${pct((SIM.bond3y[12] / SIM.bond3y[0] - 1) * 100)}</b>, 3월 말 <b>${pct((SIM.bond3y[3] / SIM.bond3y[0] - 1) * 100)}</b></p>
    <div class="sim-chart"><canvas id="simChart" role="img" aria-label="2020년 월별 자산 변화: ${type.name} 12월 말 ${won(end)}"></canvas></div>
    <p class="fine">과거 실제 상품 가격으로 계산한 모의 결과이며 미래 수익을 보장하지 않습니다.<br>KODEX 200 · SPY(원화 환산) · KODEX 국고채3년 월말 값(배당 포함), 예금 연 ${SIM.depRate.toFixed(2)}%(2020년 1월 한국은행 평균). 수수료·세금 미반영.</p>`;
}

function drawSim(type){
  if(typeof Chart === 'undefined'){ const c = document.querySelector('.sim-chart'); if(c) c.style.display='none'; return; }
  const css = getComputedStyle(document.documentElement);
  const sub = css.getPropertyValue('--sub').trim(), line = css.getPropertyValue('--line').trim();
  const mine = TYPES.indexOf(type);
  const datasets = TYPES.map((t,i)=>{
    const me = i === mine;
    return {
      label: (me ? '★ ' : '') + t.name,
      data: simulate(t.mix).map(x=>Math.round(x)),
      borderColor: me ? TYPE_HEX[i] : TYPE_HEX[i] + '59',
      backgroundColor: TYPE_HEX[i],
      borderWidth: me ? 4 : 1.5,
      pointRadius: me ? 3 : 0, pointHoverRadius: 5,
      tension: .3, order: me ? 0 : 1,
    };
  });
  charts.push(new Chart(document.getElementById('simChart'), {
    type:'line',
    data:{ labels: SIM.labels, datasets },
    options:{
      responsive:true, maintainAspectRatio:false,
      animation: reduceMotion ? false : { duration:900 },
      interaction:{ mode:'index', intersect:false },
      scales:{
        x:{ ticks:{ color:sub, font:{size:11}, maxRotation:0, autoSkip:true }, grid:{ display:false } },
        y:{ ticks:{ color:sub, font:{size:11}, callback: v => v.toLocaleString('ko-KR') }, grid:{ color:line },
            title:{ display:true, text:'만 원', color:sub, font:{size:11} } }
      },
      plugins:{
        legend:{ position:'bottom', labels:{ color:sub, boxWidth:10, boxHeight:10, font:{size:11}, padding:10 } },
        tooltip:{ callbacks:{ label: c => ` ${c.dataset.label} ${c.raw.toLocaleString('ko-KR')}만 원` } }
      }
    }
  }));
}

function drawDonut(type){
  const wrap = document.getElementById('donutWrap');
  // Chart.js를 못 불러온 경우: CSS 도넛으로 대체
  if(typeof Chart === 'undefined'){
    let acc = 0;
    const stops = ASSETS.map((a,i)=>{ const s = acc; acc += type.mix[i]; return `${a.color} ${s}% ${acc}%`; }).join(',');
    wrap.querySelector('canvas').outerHTML = `<div class="donut-css" style="background:conic-gradient(${stops})"></div>`;
    return;
  }
  const card = getComputedStyle(document.documentElement).getPropertyValue('--card').trim() || '#fff';
  charts.push(new Chart(document.getElementById('donut'), {
    type:'doughnut',
    data:{
      labels: ASSETS.map(a=>a.name),
      datasets:[{ data: type.mix, backgroundColor: ASSETS.map(a=>a.color), borderColor: card, borderWidth: 3, hoverOffset: 6 }]
    },
    options:{
      responsive:true, maintainAspectRatio:false, cutout:'60%',
      animation: reduceMotion ? false : { animateRotate:true, duration:900 },
      plugins:{
        legend:{ display:false },
        tooltip:{ filter: c => c.raw > 0, callbacks:{ label: c => ` ${c.label} ${c.raw}%` } }
      }
    }
  }));
}

function render(){
  timers.forEach(clearTimeout); timers = [];
  charts.forEach(c=>c.destroy()); charts = [];
  if(step < 0) renderStart();
  else if(step < LOADING) renderQuestion();
  else if(step === LOADING) renderLoading();
  else renderResult();
  window.scrollTo(0,0);
}
render();
</script>
</body>
</html>
